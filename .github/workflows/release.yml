name: NewTerminal Release

on:
  push:
    tags:
      - "v*.*"   # Runs on version tags like v1.0, v1.1, etc.

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Lint (PSScriptAnalyzer)
        run: ./tools/Invoke-Lint.ps1

      - name: Unit tests (Pester)
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI

  build-release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the tag matches the module version
        run: |
          version="$(sed -n "s/^\$script:ModuleVersion = '\([0-9.]*\)'.*/\1/p" NewTerminal-AI.psm1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read \$script:ModuleVersion from NewTerminal-AI.psm1"
            exit 1
          fi
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match module version ${version}. Update \$script:ModuleVersion before tagging."
            exit 1
          fi

      - name: Build release ZIP
        run: |
          dir="newterminal-${GITHUB_REF_NAME}"
          mkdir -p "$dir"
          cp NewTerminal-AI.psm1 install.ps1 install.sh README.md LICENSE CHANGELOG.md "$dir/"
          chmod +x "$dir/install.sh"
          (cd "$dir" && zip -r "../${dir}.zip" .)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "newterminal-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
